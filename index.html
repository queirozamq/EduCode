<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>EduCode Inclusivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>EduCode Inclusivo</h1>
        <p>Aprenda algoritmos de forma simples!</p>
    </header>
    <main>
        <section>
            <h2>O que é um algoritmo?</h2>
            <p>Algoritmo é uma sequência de passos utilizada para resolver um problema.</p>
        </section>
        <section>
            <h2>Teste o seu conhecimento</h2>
            <p>Quantos passos existem neste algoritmo?</p>
            <p>
                1. Pegar no computador<br>
                2. Ligar o computador<br>
                3. Esperar iniciar
            </p>
            <input id="resposta" type="number" placeholder="Digite a sua resposta">
            <button id="verificar">Verificar</button>
            <p id="resultado"></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
